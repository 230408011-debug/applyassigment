services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: pulsar
      POSTGRES_USER: pulsar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env and choose a local password}
    ports:
      - "127.0.0.1:${DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulsar -d pulsar"]
      interval: 3s
      timeout: 3s
      retries: 20
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://pulsar:${POSTGRES_PASSWORD}@db:5432/pulsar
      ARTIFACT_DIR: /app/artifacts
    ports:
      - "${APP_PORT:-5055}:5055"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - modeldata:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5055/api/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
  modeldata:
